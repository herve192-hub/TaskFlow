# ALB appends the observed client address to X-Forwarded-For. Trust only its
# subnet CIDRs and consume the last address, so caller-supplied prefixes are ignored.
include /etc/nginx/taskflow-alb-trust.conf;
real_ip_header X-Forwarded-For;
real_ip_recursive off;
limit_req_zone $binary_remote_addr zone=taskflow_auth:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=taskflow_api:10m rate=10r/s;
log_format taskflow '$remote_addr [$time_iso8601] "$request_method $uri" $status $body_bytes_sent $request_time';

server {
    listen 8080;
    server_name _;
    access_log /var/log/nginx/access.log taskflow;
    server_tokens off;
    include /etc/nginx/snippets/taskflow-security.conf;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 1m;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 30s;
    limit_req_status 429;
    root /usr/share/nginx/html;
    index index.html;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $taskflow_gateway api-gateway:8080;

    # ALB health checks omit X-Forwarded-Proto. Check gateway readiness as well.
    location = /healthz {
        access_log off;
        proxy_pass http://$taskflow_gateway/actuator/health;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
    }
    location ~ ^/auth/(login|register)$ {
        if ($http_x_forwarded_proto != https) { return 403; }
        limit_req zone=taskflow_auth burst=10 nodelay;
        include /etc/nginx/snippets/taskflow-proxy.conf;
    }
    location ~ ^/(auth|api)/ {
        if ($http_x_forwarded_proto != https) { return 403; }
        limit_req zone=taskflow_api burst=20 nodelay;
        include /etc/nginx/snippets/taskflow-proxy.conf;
    }
    location ~ /\. { deny all; }
    location / {
        if ($http_x_forwarded_proto != https) { return 403; }
        try_files $uri $uri/ /index.html;
    }
}
