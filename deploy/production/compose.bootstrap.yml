# One-time production override for initial administrator provisioning. Adds only
# the email/password secret mounts consumed by auth's bootstrap runner; the base
# stack already supplies signing/database configuration. Recreate auth without this
# override after provisioning, then remove the host copies. AWS taskflow.py performs
# that cleanup automatically when deploy is invoked with bootstrap enabled.

# Use only for initial provisioning, then remove these secret mounts on the next start.
services:
  auth-service:
    secrets:
      - source: bootstrap-admin-email
        target: taskflow.bootstrap.admin.email
      - source: bootstrap-admin-password
        target: taskflow.bootstrap.admin.password

secrets:
  bootstrap-admin-email:
    file: ${TASKFLOW_SECRETS_DIR}/taskflow.bootstrap.admin.email
  bootstrap-admin-password:
    file: ${TASKFLOW_SECRETS_DIR}/taskflow.bootstrap.admin.password
