# Production application runtime contract, reused by the AWS overlay.
# Eight containers use scoped file secrets, restricted networks, bounded resources,
# read-only roots, and health-based startup. External MongoDB/Kafka must be operated
# separately with authenticated TLS; this stack creates no database/broker volumes.
# Direct deployment publishes only frontend TLS. AWS resets that ingress and pins
# release images. Use this file alone or with documented production overlays, never
# the development Compose file. See README.md for secret ownership and provisioning.

# Production application stack. MongoDB and Kafka are separately operated TLS services.
# Only HTTPS is public. Never combine this file with the development Compose file.
# Shared JVM/container envelope for the seven Java processes. Environment merges
# must preserve runtime defaults when a service adds its own properties.
x-runtime: &runtime
  user: "10001:10001"
  restart: unless-stopped
  # Exceed Spring's shutdown phase timeout so in-flight requests can finish before SIGKILL.
  stop_grace_period: 45s
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 256
  mem_limit: 768m
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m
  logging: &runtime-logging
    driver: local
    options:
      max-size: "20m"
      max-file: "5"
  environment: &runtime-env
    JAVA_TOOL_OPTIONS: "-Xms64m -Xmx384m -XX:MaxMetaspaceSize=192m -XX:MaxDirectMemorySize=64m -XX:ActiveProcessorCount=2"
    LOGGING_LEVEL_ROOT: INFO
    LOGGING_LEVEL_COM_TASKFLOW: INFO
    SERVER_SHUTDOWN: graceful
    SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE: 30s
    SERVER_ERROR_INCLUDE_MESSAGE: never
    SERVER_ERROR_INCLUDE_BINDING_ERRORS: never
    SERVER_ERROR_INCLUDE_STACKTRACE: never
    MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health
    MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: never
    MANAGEMENT_ENDPOINT_HEALTH_SHOW_COMPONENTS: never
    SPRINGDOC_API_DOCS_ENABLED: "false"
    SPRINGDOC_SWAGGER_UI_ENABLED: "false"
  healthcheck: &health
    test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health"]
    interval: 15s
    timeout: 5s
    retries: 10
    start_period: 60s

# Client bootstrap for gateway/business services. Secret filenames become Spring
# property names through configtree; client.properties imports protected Config Server.
x-application: &application
  <<: *runtime
  networks: [control, data-egress]
  environment: &application-env
    <<: *runtime-env
    SPRING_PROFILES_ACTIVE: prod
    SPRING_CONFIG_IMPORT: configtree:/run/secrets/,file:/run/secrets/client.properties
    CONFIG_SERVER_URL: http://config-server:8888
    TASKFLOW_WEB_ORIGIN: ${TASKFLOW_WEB_ORIGIN:?Set the real HTTPS application origin}
    TASKFLOW_COOKIE_SECURE: "true"
    TASKFLOW_PUBLIC_REGISTRATION_ENABLED: "false"
    JWT_EXPIRATION_MS: "900000"
    SERVER_FORWARD_HEADERS_STRATEGY: framework
    SPRING_DATA_WEB_PAGEABLE_MAX_PAGE_SIZE: "100"
    SERVER_TOMCAT_THREADS_MAX: "100"
  depends_on:
    discovery-server:
      condition: service_healthy
    config-server:
      condition: service_healthy
  secrets: &client-secrets
    - source: jwt-public
      target: jwt.public-key
    - source: eureka-client
      target: eureka.client.service-url.defaultZone
    - source: config-client-properties
      target: client.properties

services:
  # Private service registry: internal name lookup for gateway and service clients.
  # Receives infrastructure Basic credentials, not application signing/data secrets.
  discovery-server:
    <<: *runtime
    image: taskflow/discovery-server:1.0.0
    build:
      context: ../../backend
      dockerfile: infrastructure/discovery-server/Dockerfile
    networks: [control]
    environment:
      <<: *runtime-env
      SPRING_PROFILES_ACTIVE: prod
      SPRING_CONFIG_IMPORT: configtree:/run/secrets/
    secrets:
      - source: infra-user
        target: spring.security.user.name
      - source: infra-password
        target: spring.security.user.password
    healthcheck:
      <<: *health
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8761/actuator/health"]

  # Serves the read-only non-secret config repository to authenticated clients.
  # Registers with Eureka after registry health; does not own database credentials.
  config-server:
    <<: *runtime
    image: taskflow/config-server:1.0.0
    build:
      context: ../../backend
      dockerfile: infrastructure/config-server/Dockerfile
    networks: [control]
    environment:
      <<: *runtime-env
      SPRING_PROFILES_ACTIVE: native,prod
      SPRING_CONFIG_IMPORT: configtree:/run/secrets/
    volumes:
      - ../../backend/config-repo:/app/config-repo:ro
    secrets:
      - source: infra-user
        target: spring.security.user.name
      - source: infra-password
        target: spring.security.user.password
      - source: eureka-client
        target: eureka.client.service-url.defaultZone
    depends_on:
      discovery-server:
        condition: service_healthy
    healthcheck:
      <<: *health
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8888/actuator/health"]

  # Joins edge to control for allowlisted API forwarding. No host port is published;
  # NGINX is the only ingress. It has no signing private key or database credentials.
  api-gateway:
    <<: *application
    image: taskflow/api-gateway:1.0.0
    build:
      context: ../../backend
      dockerfile: infrastructure/api-gateway/Dockerfile
    networks: [edge, control]
    secrets:
      - source: eureka-client
        target: eureka.client.service-url.defaultZone
      - source: config-client-properties
        target: client.properties

  # Credential authority and token issuer. Only this service receives jwt-private;
  # its scoped MongoDB URI cannot substitute for the other services' storage.
  auth-service:
    <<: *application
    image: taskflow/auth-service:0.0.1
    build:
      context: ../../backend
      dockerfile: services/identity/auth-service/Dockerfile
    secrets:
      - source: jwt-public
        target: jwt.public-key
      - source: jwt-private
        target: jwt.private-key
      - source: auth-mongo
        target: AUTH_MONGO_URI
      - source: eureka-client
        target: eureka.client.service-url.defaultZone
      - source: config-client-properties
        target: client.properties
    healthcheck:
      <<: *health
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8081/actuator/health"]

  # Profile/directory API. Uses the public verification key and its profile database;
  # private profile DTOs and directory summaries remain separate API contracts.
  user-service:
    <<: *application
    image: taskflow/user-service:0.0.1
    build:
      context: ../../backend
      dockerfile: services/identity/user-service/Dockerfile
    secrets:
      - source: jwt-public
        target: jwt.public-key
      - source: user-mongo
        target: USER_MONGO_URI
      - source: eureka-client
        target: eureka.client.service-url.defaultZone
      - source: config-client-properties
        target: client.properties
    healthcheck:
      <<: *health
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8082/actuator/health"]

  # Project and membership API. Stores ownership/roles in its database and calls the
  # user directory under the caller's identity for membership validation.
  project-service:
    <<: *application
    image: taskflow/project-service:0.0.1
    build:
      context: ../../backend
      dockerfile: services/work-management/project-service/Dockerfile
    secrets:
      - source: jwt-public
        target: jwt.public-key
      - source: project-mongo
        target: PROJECT_MONGO_URI
      - source: eureka-client
        target: eureka.client.service-url.defaultZone
      - source: config-client-properties
        target: client.properties
    healthcheck:
      <<: *health
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8083/actuator/health"]

  # Task API and event producer. Uses project-service permission lookups and its own
  # storage; broker credentials are mounted here because it publishes task events.
  task-service:
    <<: *application
    image: taskflow/task-service:1.0.0
    build:
      context: ../../backend
      dockerfile: services/work-management/task-service/Dockerfile
    secrets:
      - source: jwt-public
        target: jwt.public-key
      - source: task-mongo
        target: TASK_MONGO_URI
      - source: eureka-client
        target: eureka.client.service-url.defaultZone
      - source: config-client-properties
        target: client.properties
      - source: kafka-brokers
        target: spring.kafka.bootstrap-servers
      - source: kafka-protocol
        target: spring.kafka.properties.security.protocol
      - source: kafka-mechanism
        target: spring.kafka.properties.sasl.mechanism
      - source: kafka-jaas
        target: spring.kafka.properties.sasl.jaas.config
    healthcheck:
      <<: *health
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8084/actuator/health"]

  # Sole direct-deployment public listener. Builds public SPA settings, terminates TLS,
  # and forwards API traffic to the gateway. UID/cache tmpfs match the frontend image.
  taskflow-web:
    user: "101:101"
    image: taskflow/frontend:0.0.0
    build:
      context: ../../frontend
      args:
        VITE_API_BASE_URL: /
        VITE_PUBLIC_REGISTRATION_ENABLED: "false"
    restart: unless-stopped
    stop_grace_period: 30s
    logging: *runtime-logging
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 128m
    networks: [edge]
    ports:
      - "${TASKFLOW_HTTPS_PORT:-443}:8443"
    volumes:
      - ../../frontend/nginx-production.conf:/etc/nginx/conf.d/default.conf:ro
    secrets:
      - source: tls-certificate
        target: tls.certificate
      - source: tls-private
        target: tls.private-key
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
      - /var/cache/nginx:rw,noexec,nosuid,size=32m,uid=101,gid=101,mode=0700
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:8080/"]
      interval: 15s
      timeout: 5s
      retries: 10

# edge connects web to gateway; internal control links application/infrastructure;
# data-egress permits business services to reach external TLS databases/brokers.
# AWS security groups further constrain host ingress and outbound destinations.
networks:
  edge:
  control:
    internal: true
  data-egress:

# Host-file sources only: Compose mounts files, not an encrypted secret store.
# Each service above selects its minimum subset and target Spring property names.
# Preserve host ownership/modes from README; do not commit or bake these files.
secrets:
  jwt-public:
    file: ${TASKFLOW_SECRETS_DIR:?Set the protected secrets directory}/jwt.public-key
  jwt-private:
    file: ${TASKFLOW_SECRETS_DIR}/jwt.private-key
  infra-user:
    file: ${TASKFLOW_SECRETS_DIR}/spring.security.user.name
  infra-password:
    file: ${TASKFLOW_SECRETS_DIR}/spring.security.user.password
  eureka-client:
    file: ${TASKFLOW_SECRETS_DIR}/eureka.client.service-url.defaultZone
  config-client-properties:
    file: ${TASKFLOW_SECRETS_DIR}/client.properties
  auth-mongo:
    file: ${TASKFLOW_SECRETS_DIR}/auth.mongodb.uri
  user-mongo:
    file: ${TASKFLOW_SECRETS_DIR}/user.mongodb.uri
  project-mongo:
    file: ${TASKFLOW_SECRETS_DIR}/project.mongodb.uri
  task-mongo:
    file: ${TASKFLOW_SECRETS_DIR}/task.mongodb.uri
  kafka-brokers:
    file: ${TASKFLOW_SECRETS_DIR}/spring.kafka.bootstrap-servers
  kafka-protocol:
    file: ${TASKFLOW_SECRETS_DIR}/spring.kafka.properties.security.protocol
  kafka-mechanism:
    file: ${TASKFLOW_SECRETS_DIR}/spring.kafka.properties.sasl.mechanism
  kafka-jaas:
    file: ${TASKFLOW_SECRETS_DIR}/spring.kafka.properties.sasl.jaas.config
  tls-certificate:
    file: ${TASKFLOW_SECRETS_DIR}/tls.certificate
  tls-private:
    file: ${TASKFLOW_SECRETS_DIR}/tls.private-key
