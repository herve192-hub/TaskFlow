# Local development stack: builds the SPA and seven Spring services, plus disposable
# MongoDB/Kafka infrastructure with named volumes. Loads the ignored root .env;
# port bindings target loopback for developer access. This is independent of the
# production stack, which uses external TLS data services and scoped secret files.
# Health dependencies gate startup, not ongoing dependency availability. Named
# volumes retain local records/events across restarts; removing volumes deletes them.

# version: '3.9'

services:

  # Built SPA and same-origin HTTP API proxy. Only the local frontend port is needed
  # for normal browser use; the Dockerfile's VITE_* arguments become public assets.
  taskflow-web:
    image: taskflow/frontend:0.0.0
    pull_policy: build
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/}

    container_name: taskflow-web

    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:8080"

    depends_on:
      api-gateway:
        condition: service_healthy

    networks:
      - taskflow-network

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:8080/"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 10s

  # Development document store shared by the four service-owned logical databases.
  # Root credentials come from the ignored .env; mongosh ping gates startup.
  # mongodb-data persists local records; production uses external scoped TLS accounts.
  mongodb:
    image: mongo:9.0.4@sha256:dc28ed5a9d0fc616903c3f463bb1e53b92b49f441721b91926e87d90bf957ce8
    container_name: mongodb
    restart: unless-stopped

    ports:
      - "127.0.0.1:${MONGODB_PORT}:27017"

    env_file:
      - .env

    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}

    volumes:
      - mongodb-data:/data/db

    networks:
      - taskflow-network

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --username \"$${MONGO_INITDB_ROOT_USERNAME}\" --password \"$${MONGO_INITDB_ROOT_PASSWORD}\" --authenticationDatabase admin --eval \"db.adminCommand('ping').ok\" | grep 1"
        ]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Single-node KRaft broker/controller for development task events. Containers use
  # kafka:29092; host clients use the external listener. The Kafka CLI health probe
  # lists topics. Plaintext and replication factor one are local-only choices;
  # kafka-data retains events across restarts, without production redundancy.
  kafka:
    image: apache/kafka:4.1.0@sha256:bff074a5d0051dbc0bbbcd25b045bb1fe84833ec0d3c7c965d1797dd289ec88f
    container_name: taskflow-kafka
    restart: unless-stopped

    ports:
      - "127.0.0.1:${KAFKA_PORT:-9092}:9092"

    environment:
      KAFKA_NODE_ID: 1

      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093

      KAFKA_LISTENERS: >
        INTERNAL://:29092,
        CONTROLLER://:29093,
        EXTERNAL://:9092

      KAFKA_ADVERTISED_LISTENERS: >
        INTERNAL://kafka:29092,
        EXTERNAL://localhost:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >
        CONTROLLER:PLAINTEXT,
        INTERNAL:PLAINTEXT,
        EXTERNAL:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

    volumes:
      - kafka-data:/var/lib/kafka/data

    networks:
      - taskflow-network

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"
        ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
  # Eureka registry for local gateway/Feign service-name lookup. Runtime profiles
  # choose development or protected infrastructure policy; loopback publication
  # permits local diagnostics without making the registry an Internet endpoint.
  discovery-server:
    image: taskflow/discovery-server:1.0.0
    pull_policy: build
    build:
      context: ./backend
      dockerfile: infrastructure/discovery-server/Dockerfile

    container_name: discovery-server

    ports:
      - "127.0.0.1:${DISCOVERY_PORT}:8761"

    # very handy because it allows you to set environment variables in a .env file and reference them in the docker-compose.yml file.
    # no need to hardcode values in the docker-compose.yml file, making it more flexible and easier to manage. ...
    environment:
       TASKFLOW_WEB_ORIGIN: ${TASKFLOW_WEB_ORIGIN:-http://localhost:${FRONTEND_PORT:-5173}}
       SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
       EUREKA_URL: http://discovery-server:8761/eureka/

    networks:
      - taskflow-network
    restart: unless-stopped

    # here we define a healthcheck for the discovery-server service, which checks the health 
    # of the service by sending a request to the /actuator/health endpoint. ...
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:8761/actuator/health"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Native shared/service configuration source. Mounts backend/config-repo so route
  # and storage defaults can be loaded separately from JAR packaging; environment
  # supplies local values. Registry health gates startup, not future availability.
  config-server:
    image: taskflow/config-server:1.0.0
    pull_policy: build
    build:
      context: ./backend
      dockerfile: infrastructure/config-server/Dockerfile

    container_name: config-server

    env_file:
      - .env

    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      EUREKA_URL: ${EUREKA_URL}
      CONFIG_SERVER_URL: ${CONFIG_SERVER_URL}

    ports:
      - "127.0.0.1:${CONFIG_PORT}:8888"

    depends_on:
      discovery-server:
        condition: service_healthy
        required: true
      # kafka:
      #   condition: service_healthy
      #   required: true

    networks:
      - taskflow-network
    volumes:
      - ./backend/config-repo:/app/config-repo:ro

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --fail --silent http://localhost:8888/actuator/health | grep -q '\"status\":\"UP\"'"
        ]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s

  # Reactive route allowlist loaded from Config Server and resolved through Eureka.
  # NGINX normally forwards browser calls here; direct loopback access supports
  # local API clients. Business services still validate tokens and permissions.
  api-gateway:
    image: taskflow/api-gateway:1.0.0
    pull_policy: build
    build:
      context: ./backend
      dockerfile: infrastructure/api-gateway/Dockerfile

    container_name: api-gateway

    ports:
      - "127.0.0.1:${API_GATEWAY_PORT}:8080"

    #  very handy because it allows you to set environment variables in a 
    # .env file and reference them in the docker-compose.yml file. no need to hardcode values in the docker-compose.yml file,
    #  making it more flexible and easier to manage. ...
    env_file:
      - .env
    environment:
       TASKFLOW_WEB_ORIGIN: ${TASKFLOW_WEB_ORIGIN:-http://localhost:${FRONTEND_PORT:-5173}}
       SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
       EUREKA_URL: ${EUREKA_URL}
       CONFIG_SERVER_URL: ${CONFIG_SERVER_URL}

    # The depends_on option specifies that the api-gateway service depends on the discovery-server and config-server services.
    # The condition: service_healthy option specifies that the api-gateway service should only start after 
    # the discovery-server and config-server services are healthy. This ensures that the api-gateway service does not start until its dependencies are ready. ...
    depends_on:
      discovery-server:
        condition: service_healthy
        required: true
      config-server:
        condition: service_healthy
        required: true

      # kafka:
      #   condition: service_healthy
      #   required: true

    networks:
      - taskflow-network
    restart: unless-stopped

    # here we define a healthcheck for the api-gateway service, 
    # which checks the health of the service by sending a request to the /actuator/health endpoint. ...
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:8080/actuator/health"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
  # Credential account creation/sign-in and token issuance. Owns taskflow-auth in
  # MongoDB; profile creation is a separate user-service request. Local environment
  # controls signing/settings; production uses scoped file imports instead.
  auth-service:
    image: taskflow/auth-service:0.0.1
    pull_policy: build
    build:
      context: ./backend
      dockerfile: services/identity/auth-service/Dockerfile

    container_name: auth-service

    ports:
      - "127.0.0.1:${AUTH_SERVICE_PORT}:8081"

    env_file:
      - .env
    environment:
       TASKFLOW_WEB_ORIGIN: ${TASKFLOW_WEB_ORIGIN:-http://localhost:${FRONTEND_PORT:-5173}}
       SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
       EUREKA_URL: ${EUREKA_URL}
       CONFIG_SERVER_URL: ${CONFIG_SERVER_URL}
       AUTH_MONGO_URI: ${AUTH_MONGO_URI}

    depends_on:
      discovery-server:
        condition: service_healthy
        required: true
      config-server:
        condition: service_healthy
        required: true
      mongodb:
        condition: service_healthy
        required: true
      # kafka:
      #   condition: service_healthy
      #   required: true

    networks:
      - taskflow-network
    restart: unless-stopped

    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:8081/actuator/health"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
      
  # Profiles, preferences, avatars, and directory summaries in taskflow-users.
  # Links documents to canonical auth IDs without owning sign-in credentials.
  # Project/member screens call its summary endpoints through the gateway.
  user-service:
    image: taskflow/user-service:0.0.1
    pull_policy: build
    build:
      context: ./backend
      dockerfile: services/identity/user-service/Dockerfile

    container_name: user-service

    ports:
      - "127.0.0.1:${USER_SERVICE_PORT}:8082"

    env_file:
      - .env

    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      EUREKA_URL: ${EUREKA_URL}
      CONFIG_SERVER_URL: ${CONFIG_SERVER_URL}

      MONGODB_HOST: mongodb
      MONGODB_PORT: ${MONGODB_PORT}
      USER_MONGO_URI: ${USER_MONGO_URI}
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}

      LOGGING_LEVEL_ROOT: ${LOGGING_LEVEL_ROOT}
      LOGGING_LEVEL_COM_TASKFLOW: ${LOGGING_LEVEL_COM_TASKFLOW}

    depends_on:
      discovery-server:
        condition: service_healthy
        required: true

      config-server:
        condition: service_healthy
        required: true

      mongodb:
        condition: service_healthy
        required: true

      # kafka:
      #   condition: service_healthy
      #   required: true

    networks:
      - taskflow-network

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:8082/actuator/health"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s

  # Project metadata and membership roles in taskflow-projects. Validates member
  # identities through user-service and answers internal task authorization checks;
  # those logical links are not cross-database foreign keys.
  project-service:
    image: taskflow/project-service:0.0.1
    pull_policy: build
    build:
      context: ./backend
      dockerfile: services/work-management/project-service/Dockerfile

    container_name: project-service

    ports:
      - "127.0.0.1:${PROJECT_SERVICE_PORT}:8083"

    env_file:
      - .env

    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      EUREKA_URL: ${EUREKA_URL}
      CONFIG_SERVER_URL: ${CONFIG_SERVER_URL}

      MONGODB_HOST: mongodb
      MONGODB_PORT: ${MONGODB_PORT}
      PROJECT_MONGO_URI: ${PROJECT_MONGO_URI}
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}

      LOGGING_LEVEL_ROOT: ${LOGGING_LEVEL_ROOT}
      LOGGING_LEVEL_COM_TASKFLOW: ${LOGGING_LEVEL_COM_TASKFLOW}

    depends_on:
      discovery-server:
        condition: service_healthy
        required: true

      config-server:
        condition: service_healthy
        required: true

      mongodb:
        condition: service_healthy
        required: true

      # kafka:
      #   condition: service_healthy
      #   required: true

    networks:
      - taskflow-network

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:8083/actuator/health"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s
  # Task lifecycle and soft-deleted records in taskflow-tasks. Consults project/user
  # services with the caller's token and publishes status/completion events to Kafka.
  # Startup health ordering does not guarantee event delivery or ongoing availability.
  task-service:
    image: taskflow/task-service:1.0.0
    pull_policy: build
    build:
      context: ./backend
      dockerfile: services/work-management/task-service/Dockerfile

    container_name: task-service

    ports:
      - "127.0.0.1:${TASK_SERVICE_PORT}:8084"

    env_file:
      - .env

    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      EUREKA_URL: ${EUREKA_URL}
      CONFIG_SERVER_URL: ${CONFIG_SERVER_URL}

      MONGODB_HOST: mongodb
      MONGODB_PORT: ${MONGODB_PORT}
      TASK_MONGO_URI: ${TASK_MONGO_URI}
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}

      KAFKA_BOOTSTRAP_SERVERS: kafka:29092

      LOGGING_LEVEL_ROOT: ${LOGGING_LEVEL_ROOT}
      LOGGING_LEVEL_COM_TASKFLOW: ${LOGGING_LEVEL_COM_TASKFLOW}

    depends_on:
      discovery-server:
        condition: service_healthy
        required: true

      config-server:
        condition: service_healthy
        required: true

      mongodb:
        condition: service_healthy
        required: true

      kafka:
        condition: service_healthy
        required: true

    networks:
      - taskflow-network

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--spider",
          "--quiet",
          "http://localhost:8084/actuator/health"
        ]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s


# Docker-managed development persistence. Restarting containers retains these;
# compose down with volume removal destroys the local database and event history.
volumes:
  mongodb-data:
    # driver: local
  kafka-data:
    # driver: local

# One local bridge permits service-name DNS; production splits edge/control/egress.
networks:
  taskflow-network:
    driver: bridge
