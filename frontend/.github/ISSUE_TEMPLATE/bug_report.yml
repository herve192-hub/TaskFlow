# Frontend bug-report form describing symptoms, reproduction, and expected behavior.
# This nested location is frontend metadata; GitHub's repository-level issue picker
# normally reads root .github/ISSUE_TEMPLATE. Moving it there would change repository
# behavior and should be an explicit configuration change.

name: Bug Report

description: Report a bug
title: "[BUG]"
labels:
  - bug


body:
  - type: textarea
    id: description
    attributes:
      label: Description
      placeholder: Describe the bug


  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce


  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
