# Frontend feature-request form for motivation and acceptance criteria.
# This nested frontend metadata is not the root GitHub issue-template directory;
# move/configure it explicitly if enabling repository-wide issue forms.


name: Feature Request
description: Suggest a feature
title: "[FEATURE]"
labels:
  - enhancement

body:
  - type: textarea
    id: summary
    attributes:
      label: Summary

  - type: textarea
    id: motivation
    attributes:
      label: Motivation

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
