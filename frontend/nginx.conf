log_format taskflow '$remote_addr [$time_iso8601] "$request_method $uri" $status $body_bytes_sent $request_time';

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    access_log /var/log/nginx/access.log taskflow;
    client_max_body_size 1m;
    include /etc/nginx/snippets/taskflow-security.conf;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $taskflow_gateway api-gateway:8080;

    location ~ ^/(auth|api)/ {
        proxy_pass http://$taskflow_gateway$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Forwarded "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_hide_header Server;
    }

    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
