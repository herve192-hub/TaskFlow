limit_req_zone $binary_remote_addr zone=taskflow_auth:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=taskflow_api:10m rate=10r/s;
log_format taskflow '$remote_addr [$time_iso8601] "$request_method $uri" $status $body_bytes_sent $request_time';

# Container health only; this port is never published in production.
server {
    listen 8080;
    server_tokens off;
    location = / { return 200 'healthy'; }
    location / { return 404; }
}

server {
    listen 8443 ssl;
    server_name _;
    access_log /var/log/nginx/access.log taskflow;
    server_tokens off;
    ssl_certificate /run/secrets/tls.certificate;
    ssl_certificate_key /run/secrets/tls.private-key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5:!3DES;
    ssl_session_tickets off;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 10m;

    include /etc/nginx/snippets/taskflow-security.conf;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 1m;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 30s;
    limit_req_status 429;

    root /usr/share/nginx/html;
    index index.html;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $taskflow_gateway api-gateway:8080;

    location ~ ^/auth/(login|register)$ {
        limit_req zone=taskflow_auth burst=10 nodelay;
        include /etc/nginx/snippets/taskflow-proxy.conf;
    }

    location ~ ^/(auth|api)/ {
        limit_req zone=taskflow_api burst=20 nodelay;
        include /etc/nginx/snippets/taskflow-proxy.conf;
    }

    location ~ /\. { deny all; }
    location / { try_files $uri $uri/ /index.html; }
}
