# Production TLS-edge proxy settings shared by authentication and API locations.
proxy_pass http://$taskflow_gateway$request_uri;
proxy_set_header Host $http_host;
# Replace client-supplied forwarding headers with values established by this ingress.
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Host $http_host;
proxy_set_header X-Forwarded-Port "";
proxy_set_header X-Forwarded-Prefix "";
proxy_set_header X-Forwarded-Ssl "";
proxy_set_header Forwarded "";
proxy_connect_timeout 3s;
proxy_read_timeout 15s;
proxy_hide_header Server;
