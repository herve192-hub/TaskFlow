# Browser response-header policy included by local, direct TLS, and AWS servers.
# CSP allows the SPA's own scripts/API and data-URL avatars; inline styles are needed
# for Emotion/MUI. External fonts requested by index.html are blocked by this policy,
# so fallback fonts may render. Change asset loading and this policy together.
# NGINX add_header inheritance depends on context: preserve these headers when adding
# headers inside locations. HTTPS ingress adds HSTS alongside this include.

# Apply browser protections to successful and error responses via always.
# Scripts remain same-origin; inline styles support MUI/Emotion's runtime-generated styling.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy same-origin always;
add_header Cross-Origin-Resource-Policy same-origin always;
