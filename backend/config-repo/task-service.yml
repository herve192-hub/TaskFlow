# Central task storage and Kafka producer configuration consumed by task-service.
# TASK_MONGO_URI and production Kafka security properties arrive through scoped
# runtime mounts. Versioned topics match KafkaTaskEventPublisher message contracts;
# acks/idempotence improve broker delivery but do not make MongoDB writes and sends
# atomic. Keep topic changes coordinated with any external consumers.

# Task persistence and the Kafka producer used by status-change/completion events.
server:
  port: 8084

spring:
  application:
    name: task-service

  mongodb:
    uri: ${TASK_MONGO_URI}
    database: taskflow-tasks

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      acks: all

      properties:
        # Producer retries use idempotence; this does not make MongoDB and Kafka one atomic transaction.
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        spring.json.add.type.headers: false # Consumers use the versioned message schema, not Java class names.

taskflow:
  kafka:
    topics:
      # These names must match consumer subscriptions and the publisher's configured destinations.
      task-status-changed: task.status.changed.v1
      task-completed: task.completed.v1
