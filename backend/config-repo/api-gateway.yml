# Central gateway route and browser-origin policy loaded from Config Server.
# The explicit /auth and versioned users/projects/tasks routes resolve through Eureka;
# discovery lookup does not automatically expose every registered service. Keep paths
# aligned with frontend API modules and NGINX. Credentialed CORS requires an exact
# origin; production passes TASKFLOW_WEB_ORIGIN and keeps infrastructure paths private.

# Explicit public routes for the reactive gateway; /internal and infrastructure APIs stay unlisted.
server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 2000
            response-timeout: 10s
          discovery:
            locator:
              # Discovery supplies addresses for allowlisted routes, not automatic public endpoints.
              enabled: false
              lower-case-service-id: true

          globalcors:
            # One explicit origin is required when browser requests include authentication cookies.
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - ${TASKFLOW_WEB_ORIGIN:http://localhost:5173}
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowedHeaders:
                  - Authorization
                  - Content-Type
                  - Accept
                  - Origin
                  - X-Requested-With
                  - X-XSRF-TOKEN
                allowCredentials: true
                exposedHeaders:
                  - Authorization
                maxAge: 3600

          routes:
            # lb:// resolves each service name through Eureka while retaining the incoming API path.
            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/auth/**

            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/api/v1/users/**

            - id: project-service
              uri: lb://project-service
              predicates:
                - Path=/api/v1/projects/**

            - id: task-service
              uri: lb://task-service
              predicates:
                - Path=/api/v1/tasks/**

          default-filters:
            # Avoid duplicate CORS response headers when both gateway and downstream service add them.
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  level:
    org.springframework.cloud.gateway: INFO
