# Shared defaults served by Config Server; service-named files supply database and routing settings.
# Keep credential values in runtime properties/secret files rather than this repository.

spring:
  # MongoDB URIs are configured separately for each service's database account.

kafka:
  bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://discovery-server:8761/eureka/}
  
  instance:
    prefer-ip-address: true

management:
  # Publish only health here; application security rules also restrict actuator access.
  endpoints:
    web:
      exposure:
        include: health

  endpoint:
    health:
      show-details: never
      show-components: never

info:
  application:
    name: taskflow
    version: 1.0.0
    author: Herve Chendjou

logging:
  level:
    root: INFO
    com.taskflow: INFO

jwt:
  # HMAC is for development; production supplies RSA key properties through scoped secret files.
  secret: ${JWT_SECRET:}
  expiration: ${JWT_EXPIRATION_MS:900000}

app:
  environment: ${APP_ENV:local}
  cors:
    allowed-origins:
      - http://localhost:3000
      - http://localhost:5173
