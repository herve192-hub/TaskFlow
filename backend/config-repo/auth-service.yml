# taskflow/backend/config-repo/auth-service.yml ...
server:
  port: 8081

spring:
  application:
    name: auth-service

  data:
    mongodb:
      uri: ${AUTH_MONGO_URI}
      database: taskflow-auth

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics