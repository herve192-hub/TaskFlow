# Auth owns credential accounts; its MongoDB URI is resolved from runtime configuration.
server:
  port: 8081

spring:
  application:
    name: auth-service

  mongodb:
    # Supply the complete connection URI through the auth service's scoped secret mount.
    uri: ${AUTH_MONGO_URI}
    database: taskflow-auth

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
