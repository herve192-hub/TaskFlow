# Central profile/directory storage configuration consumed by user-service.
# USER_MONGO_URI comes from its scoped runtime mount; the database contains profiles
# linked to canonical auth IDs, not passwords. Port 8082 must match Compose health
# checks. Production URI policy requires authenticated TLS storage.


# Profiles live in a separate database from auth credentials, linked by canonical account IDs.
server:
  port: 8082

spring:
  application:
    name: user-service

  mongodb:
    # The runtime supplies this URI; production must use verified TLS and a scoped account.
    uri: ${USER_MONGO_URI}
    database: taskflow-users
