# Root Maven Wrapper distribution selection used by backend/mvnw and Docker builds.
# Only-script mode downloads the pinned Maven distribution rather than committing a
# wrapper JAR. Java/framework versions live in backend/pom.xml independently.
# Keep this committed configuration when excluding downloaded Maven/build artifacts.

wrapperVersion=3.3.4
distributionType=only-script
distributionUrl=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.16/apache-maven-3.9.16-bin.zip
