# Local bootstrap defaults; deployed stacks provide protected Config Server and secret-file imports.
spring:
  data:
    mongodb:
      # Enforce the credential account's unique email and username indexes when collections are initialized.
      auto-index-creation: true
  application:
    name: auth-service

  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  
  lifecycle:
    timeout-per-shutdown-phase: 30s

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true

    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

  instance:
    prefer-ip-address: true

jwt:
  # Durations are milliseconds. Production requires RSA keys and an access lifetime of 1-15 minutes.
  secret: ${JWT_SECRET:}
  issuer: taskflow
  expiration: ${JWT_EXPIRATION_MS:900000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION_MS:604800000}

management:
  # Exposure enables endpoint registration; SecurityConfig permits public access to health only.
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: never
      show-components: never

logging:
  level:
    root: INFO
    com.taskflow: DEBUG

server:
  shutdown: graceful
