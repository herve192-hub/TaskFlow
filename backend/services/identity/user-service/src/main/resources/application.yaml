# Profile-service bootstrap defaults; centralized configuration supplies the service-specific MongoDB URI.
spring:
  application:
    name: user-service

  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}

  lifecycle:
    timeout-per-shutdown-phase: 30s

  mongodb:
    # Fallback host fields support local runs; never put deployed credentials in this file.
    host: ${MONGODB_HOST:mongodb}
    port: ${MONGODB_PORT:27017}
    database: ${MONGODB_DATABASE:taskflow-users}
    username: ${MONGO_INITDB_ROOT_USERNAME:}
    password: ${MONGO_INITDB_ROOT_PASSWORD:}
    authentication-database: admin

server:
  port: ${USER_SERVICE_PORT:8082}
  shutdown: graceful

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.uuid}

jwt:
  # JWT_SECRET supports development. Production verification uses the mounted RSA public key.
  secret: ${JWT_SECRET:}
  issuer: taskflow
  expiration: ${JWT_EXPIRATION_MS:900000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION_MS:604800000}

management:
  # Exposure and authorization are separate; SecurityConfig denies actuator routes other than health.
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
          - prometheus

  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true

logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}
    com.taskflow: ${LOGGING_LEVEL_COM_TASKFLOW:INFO}

info:
  app:
    name: ${spring.application.name}
    version: 1.0.0
    description: User Management Service
