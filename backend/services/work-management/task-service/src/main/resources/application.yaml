# Task bootstrap defaults for configuration, discovery, fallback storage, shutdown,
# and health. Central task-service.yml adds task database and event producer settings;
# production mounts the URI, public JWT key, and Kafka security properties per service.
# Keep internal port/health probes aligned with Compose and avoid credentials in defaults.

# Task-service bootstrap defaults; Config Server supplies persistence and Kafka producer settings.
spring:
  application:
    name: task-service

  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}

  lifecycle:
    timeout-per-shutdown-phase: 30s

  mongodb:
    # Deployment URIs and credentials come from runtime configuration, not committed values.
    host: ${MONGODB_HOST:mongodb}
    port: ${MONGODB_PORT:27017}
    database: ${MONGODB_DATABASE:taskflow-tasks}
    username: ${MONGO_INITDB_ROOT_USERNAME:}
    password: ${MONGO_INITDB_ROOT_PASSWORD:}
    authentication-database: admin

server:
  port: ${TASK_SERVICE_PORT:8084}
  shutdown: graceful

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true

    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.uuid}

jwt:
  # Shared development HMAC settings; production instead supplies an RSA verification key.
  secret: ${JWT_SECRET:}
  issuer: taskflow
  expiration: ${JWT_EXPIRATION_MS:900000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION_MS:604800000}

management:
  # Keep health details hidden; the security chain separately denies other actuator HTTP routes.
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
          - prometheus

  endpoint:
    health:
      show-details: never
      show-components: never

  health:
    probes:
      enabled: true

logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}
    com.taskflow: ${LOGGING_LEVEL_COM_TASKFLOW:INFO}

info:
  app:
    name: ${spring.application.name}
    version: 1.0.0
    description: Task Management Service
