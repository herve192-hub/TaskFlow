# Project/membership bootstrap: service identity, fallback storage, configuration
# and discovery clients, graceful shutdown, and health visibility. Central YAML and
# scoped runtime mounts supply the deployment URI/public verification key. Port and
# health checks must remain coordinated with production Compose. Project roles are
# application policy, independent of these transport/startup settings.

# Project-service bootstrap defaults; Config Server supplies project/membership storage settings.
spring:
  application:
    name: project-service

  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}

  lifecycle:
    timeout-per-shutdown-phase: 30s

  mongodb:
    # Local connection defaults are overridden by the runtime URI and protected credentials.
    host: ${MONGODB_HOST:mongodb}
    port: ${MONGODB_PORT:27017}
    database: ${MONGODB_DATABASE:taskflow-projects}
    username: ${MONGO_INITDB_ROOT_USERNAME:}
    password: ${MONGO_INITDB_ROOT_PASSWORD:}
    authentication-database: admin

server:
  port: ${PROJECT_SERVICE_PORT:8083}
  shutdown: graceful

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.uuid}

jwt:
  # Consumers verify production tokens with the RSA public key; only auth receives the private key.
  secret: ${JWT_SECRET:}
  issuer: taskflow
  expiration: ${JWT_EXPIRATION_MS:900000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION_MS:604800000}

management:
  # SecurityConfig restricts HTTP access to health even when other actuator endpoints are registered.
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
          - prometheus

  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true

logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}
    com.taskflow: ${LOGGING_LEVEL_COM_TASKFLOW:INFO}

info:
  app:
    name: ${spring.application.name}
    version: 1.0.0
    description: Project Management Service

