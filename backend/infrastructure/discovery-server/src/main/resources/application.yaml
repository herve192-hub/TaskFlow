# Standalone internal Eureka registry on port 8761. Does not register/fetch itself;
# application clients register addresses used by gateway and Feign load balancing.
# Self-preservation tolerates missed heartbeats. Shared infrastructure security
# protects registry access; production keeps this container on the control network.

# Standalone Eureka registry; application clients register and discover internal service instances here.
server:
  port: 8761

spring:
  application:
    name: discovery-server
# This registry does not register with itself or fetch another registry.
eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
  # Keep self-preservation enabled when heartbeat delivery is disrupted.
  server:
    enable-self-preservation: true
