# Config Server reads repository files locally; no Git-host credentials are needed for native mode.

server:
  port: 8888

spring:
  application:
    name: config-server

  profiles:
    active: native
  # Search bundled defaults and /app/config-repo, the repository mounted by Compose.
  cloud:
    config:
      server:
        native:
          search-locations: classpath:/config,file:/app/config-repo
# Discovery credentials are added by EurekaClientAuthentication instead of being embedded in the URL.
eureka:
  client:
    service-url:
      defaultZone: http://discovery-server:8761/eureka/
# Healthchecks need no credentials and do not reveal component details.
management:
  endpoints:
    web:
      exposure:
        include: health

  endpoint:
    health:
      show-details: never
      show-components: never
