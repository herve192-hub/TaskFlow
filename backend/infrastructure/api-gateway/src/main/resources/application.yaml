# Gateway bootstrap settings; the Config Server repository owns the explicit public route list.
server:
  port: 8080

spring:
  application:
    name: api-gateway
  # Deployed stacks supply protected Config Server client credentials during bootstrap.
  config:
    import: optional:configserver:http://config-server:8888
# Eureka resolves the lb:// destinations configured in config-repo/api-gateway.yml.
eureka:
  client:
    service-url:
      defaultZone: http://discovery-server:8761/eureka/
# Active route settings use spring.cloud.gateway.server.webflux in Config Server's api-gateway.yml.
cloud:
  gateway:
    discovery:
      locator:
        enabled: false
        lower-case-service-id: true
# Publish health for container checks without exposing the discovery registry or configuration APIs.
management:
  endpoints:
    web:
      exposure:
        include: health
