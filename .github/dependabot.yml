version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /frontend
    versioning-strategy: increase
    schedule:
      interval: weekly
    groups:
      development-dependencies:
        dependency-type: development
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directories:
      - /frontend
      - /backend/infrastructure/api-gateway
      - /backend/infrastructure/config-server
      - /backend/infrastructure/discovery-server
      - /backend/services/identity/auth-service
      - /backend/services/identity/user-service
      - /backend/services/work-management/project-service
      - /backend/services/work-management/task-service
    schedule:
      interval: weekly
    groups:
      container-base-images:
        patterns: ['*']
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    allow:
      - dependency-name: mongo
      - dependency-name: apache/kafka
