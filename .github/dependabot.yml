# Weekly dependency-update proposals for Actions, frontend npm, backend Maven,
# container bases, and development MongoDB/Kafka images. Group related changes for
# review, then rely on CI to check compatibility and security. Updating a Docker tag
# must retain a valid digest, and exact npm versions must remain synchronized with
# the lockfile. This configuration proposes changes; it does not release or deploy.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /frontend
    versioning-strategy: increase
    schedule:
      interval: weekly
    groups:
      development-dependencies:
        dependency-type: development
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directories:
      - /frontend
      - /backend/infrastructure/api-gateway
      - /backend/infrastructure/config-server
      - /backend/infrastructure/discovery-server
      - /backend/services/identity/auth-service
      - /backend/services/identity/user-service
      - /backend/services/work-management/project-service
      - /backend/services/work-management/task-service
    schedule:
      interval: weekly
    groups:
      container-base-images:
        patterns: ['*']
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    allow:
      - dependency-name: mongo
      - dependency-name: apache/kafka
