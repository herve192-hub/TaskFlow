name: Backend CI

on:
  push:
    branches:
      - main
      - develop
      - dev/feature-workflows
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and Test Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Make Maven Wrapper Executable
        run: chmod +x mvnw

      - name: Verify Java
        run: java -version

      - name: Verify Maven Wrapper
        run: ./mvnw -version

      # Run the complete backend test suite first.
      # Any failing unit or Spring context test stops the workflow here.
      - name: Run Backend Tests
        run: ./mvnw clean test

      # Package all backend modules only after the test suite passes.
      # Tests are skipped here because they already ran in the previous step.
      - name: Package Backend
        run: ./mvnw package -DskipTests

      - name: Build Discovery Server Image
        run: docker build -f infrastructure/discovery-server/Dockerfile -t taskflow/discovery-server .

      - name: Build Config Server Image
        run: docker build -f infrastructure/config-server/Dockerfile -t taskflow/config-server .

      - name: Build API Gateway Image
        run: docker build -f infrastructure/api-gateway/Dockerfile -t taskflow/api-gateway .
