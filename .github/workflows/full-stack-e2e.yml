# Integration pipeline tying the actual browser to NGINX, gateway, business services,
# MongoDB, and Kafka using isolated disposable fixtures. Independently validates
# Terraform without AWS credentials. Production Compose policy and TLS/ALB ingress
# regressions are tested locally; this workflow does not deploy infrastructure.
# Stage JARs and generated secrets before starting Compose; redact diagnostics before
# teardown and upload only allowlisted test artifacts. Always attempt volume cleanup.

# Exercise the real browser, NGINX, gateway, services, MongoDB, and Kafka together.
# The Compose stack uses disposable credentials and data, with no production deployment.
name: Full-stack E2E

on:
  push:
    branches: [main, develop, dev/feature-workflows]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/**'
      - '.github/scripts/**'
      - '.github/e2e/**'
      - 'docker-compose.yml'
      - 'deploy/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/**'
      - '.github/scripts/**'
      - '.github/e2e/**'
      - 'docker-compose.yml'
      - 'deploy/**'
  schedule:
    # Monday at 08:23 UTC: periodically exercise startup and collaboration without a code change.
    - cron: '23 8 * * 1'
  workflow_dispatch:

# No repository writes or deployment credentials are required by this test stack.
permissions:
  contents: read

# Stop superseded runs for the same event/ref so obsolete stacks do not keep running.
concurrency:
  group: full-stack-e2e-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  aws-terraform:
    name: AWS Terraform validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install checksum-verified Terraform
        env:
          TERRAFORM_VERSION: '1.16.7'
        run: |
          terraform_dir="$RUNNER_TEMP/taskflow-terraform"
          mkdir -p "$terraform_dir"
          cd "$terraform_dir"
          archive="terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
          base="https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}"
          curl --fail --location --silent --show-error --retry 3 "$base/$archive" --output "$archive"
          curl --fail --location --silent --show-error --retry 3 "$base/terraform_${TERRAFORM_VERSION}_SHA256SUMS" --output checksums.txt
          awk -v archive="$archive" '$2 == archive {print}' checksums.txt | sha256sum --check --strict
          unzip -q "$archive" -d "$terraform_dir"
          echo "$terraform_dir" >> "$GITHUB_PATH"

      - name: Validate infrastructure without AWS credentials
        working-directory: deploy/aws/terraform
        run: |
          terraform fmt -check
          terraform init -backend=false -input=false -lockfile=readonly
          terraform validate -no-color

  collaboration:
    name: Full-stack collaboration and access controls
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Scope Compose commands to the test project and explicitly select its generated env file.
      COMPOSE_PROJECT_NAME: taskflow-e2e
      COMPOSE_FILE: .github/e2e/compose.yml
      COMPOSE_ENV_FILES: .github/e2e/.env.runtime
      COMPOSE_DISABLE_ENV_FILE: '1' # Prevent implicit loading of a developer's default .env.
      TASKFLOW_E2E_IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Enforce production deployment policy
        # Reject security regressions in the real rendered normal and bootstrap configurations.
        run: |
          python3 .github/scripts/test-verify-production-compose.py
          python3 .github/scripts/verify-production-compose.py
          python3 -m unittest discover -s deploy/aws/tests -v

      - name: Set up Temurin 21.0.12.1+1
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21.0.12+101.0.LTS'
          distribution: temurin
          cache: maven
          cache-dependency-path: 'backend/**/pom.xml'

      - name: Set up pinned Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Unit/integration suites run in Backend CI; package the entire real stack once.
      - name: Package all backend services
        working-directory: backend
        run: bash ./mvnw --batch-mode --no-transfer-progress clean package -DskipTests

      - name: Stage services and generate temporary credentials
        # Stage executable JARs and generate RSA keys and credential files in ignored directories.
        run: python3 .github/scripts/prepare-full-stack-e2e.py

      - name: Install browser test dependencies
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps --only-shell chromium

      - name: Build production frontend and start the isolated stack
        # Wait up to five minutes for the configured container healthchecks before browser tests.
        run: docker compose up --build --detach --wait --wait-timeout 300

      - name: Run collaboration, persistence, Kafka, and authorization checks
        # Playwright uses the Compose frontend; the full-stack config does not start Vite preview.
        working-directory: frontend
        run: npm run test:e2e:full-stack

      - name: Verify production HTTPS, headers, and authentication rate limits
        # A separate temporary ingress fixture uses an explicitly trusted test certificate.
        env:
          TASKFLOW_E2E_FRONTEND_IMAGE: taskflow/frontend-production-check:${{ github.sha }}
          TASKFLOW_AWS_FRONTEND_IMAGE: taskflow/frontend-production-check:${{ github.sha }}
        run: |
          docker build --build-arg VITE_API_BASE_URL=/ --build-arg VITE_PUBLIC_REGISTRATION_ENABLED=false \
            --tag "$TASKFLOW_E2E_FRONTEND_IMAGE" frontend
          python3 .github/scripts/verify-production-ingress.py
          python3 .github/scripts/verify-aws-ingress.py

      - name: Collect container status and logs
        # Collect before teardown; the helper redacts generated credentials and JWTs.
        if: always()
        run: python3 .github/scripts/collect-e2e-logs.py

      - name: Stop the isolated stack and remove its test data
        # Attempt cleanup even after a failed build, startup, or test.
        if: always()
        run: |
          if [ -f .github/e2e/.env.runtime ]; then
            docker compose down --volumes --remove-orphans
          fi

      - name: Upload browser reports, failure traces, and container logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: full-stack-e2e-reports
          # Keep this allowlist narrow: generated keys, environment files, and JARs are excluded.
          path: |
            frontend/test-results/full-stack/
            frontend/test-results/full-stack.xml
            frontend/playwright-report/full-stack/
            .github/e2e/logs/
          include-hidden-files: true # Allow the explicitly selected logs under .github/.
          retention-days: 14
          if-no-files-found: warn
