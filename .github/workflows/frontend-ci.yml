# Frontend verification pipeline: lint/tests/build, browser smoke, all-scope npm
# audit, and final-image vulnerability scanning. Container scanning depends on a
# successful build/test job; dependency audit runs independently. Full-service flows
# live in full-stack-e2e.yml. Reports are retained briefly; Trivy artifacts must pass
# summarize-trivy.py redaction before upload. Read-only jobs do not publish images.

# Check the frontend build and browser smoke flows, audit npm, and scan the runtime image.
# Cross-service browser scenarios are exercised separately in full-stack-e2e.yml.
name: Frontend CI

on:
  push:
    branches: [main, develop, dev/feature-workflows]
    # Shared scripts and deployment settings can change the frontend build or ingress.
    paths:
      - 'frontend/**'
      - '.github/workflows/**'
      - '.github/scripts/**'
      - 'docker-compose.yml'
      - 'deploy/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'frontend/**'
      - '.github/workflows/**'
      - '.github/scripts/**'
      - 'docker-compose.yml'
      - 'deploy/**'
  schedule:
    # Monday at 08:23 UTC: recheck the pinned dependencies for newly published advisories.
    - cron: '23 8 * * 1'
  workflow_dispatch:

# Source checkout requires read access; builds and scans do not publish releases.
permissions:
  contents: read

# Keep the newest run for each event/ref pair.
concurrency:
  group: frontend-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Frontend lint, unit tests, integration tests, and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pinned Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Use the developer version file and invalidate npm's cache when the lockfile changes.
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        # Install the committed lockfile exactly; do not resolve fresh dependency versions.
        run: npm ci

      - name: Run lint
        run: npm run lint

      # Both named Vitest projects run; missing tests fail the command.
      - name: Run unit and integration tests with coverage
        run: npm run test:ci

      - name: Type-check and build application
        run: npm run build

      - name: Install Chromium for browser tests
        # The locally installed Playwright version selects its matching headless Chromium build.
        run: npx playwright install --with-deps --only-shell chromium

      - name: Run browser smoke tests against the production build
        # playwright.config.ts starts Vite preview against the dist output built above.
        run: npm run test:e2e

      - name: Upload test and coverage reports
        # Preserve available diagnostics after failed tests or browser checks.
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-test-reports
          path: |
            frontend/test-results/
            frontend/coverage/
            frontend/playwright-report/
          retention-days: 14
          if-no-files-found: warn

  dependency-security:
    # Audit independently so test failures do not prevent dependency findings from surfacing.
    name: Audit all npm dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pinned Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies without lifecycle scripts
        # Auditing needs the dependency tree but does not require package install scripts.
        run: npm ci --ignore-scripts

      - name: Fail on high or critical dependency vulnerabilities
        # Development tooling can affect the build; include dev, optional, and peer packages.
        run: npm audit --audit-level=high --include=dev --include=optional --include=peer --json > npm-audit.json

      - name: Upload dependency audit report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-dependency-security
          path: frontend/npm-audit.json
          retention-days: 14

  container-security:
    name: Build and scan frontend image
    # Scan a runtime image only after lint, tests, type checking, and the build succeed.
    needs: build-and-test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build frontend image
        run: docker build --tag "taskflow/frontend:$GITHUB_SHA" frontend

      - name: Scan runtime image dependencies
        id: trivy_scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          # Inspect the final NGINX image; npm dependency auditing is handled above.
          version: v0.75.0
          image-ref: taskflow/frontend:${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'
          format: json
          output: image-security.json

      # Redact successful or failed scans; a skipped scan has no report to summarize.
      - name: Show security findings in the log and job summary
        id: security_summary
        if: always() && (steps.trivy_scan.outcome == 'success' || steps.trivy_scan.outcome == 'failure')
        run: python3 .github/scripts/summarize-trivy.py image-security.json

      - name: Upload image scan report
        # Never upload a report unless the redaction step completed successfully.
        if: always() && steps.security_summary.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-image-security
          path: image-security.json
          retention-days: 14
